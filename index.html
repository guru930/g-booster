<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>G-SHOP SMART-TIMING ENGINE</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; margin: 0; }
        .control-panel { background: #111; padding: 25px; border-bottom: 2px solid #00ff00; position: sticky; top: 0; z-index: 1000; box-shadow: 0 0 20px #00ff0033; }
        input { padding: 12px; width: 65%; background: #000; color: #00ff00; border: 1px solid #00ff00; margin-bottom: 15px; outline: none; }
        button { padding: 15px 40px; background: #00ff00; color: #000; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 15px #fff; }
        #log-stream { font-size: 13px; height: 30px; overflow: hidden; margin-top: 10px; color: #00ccff; }
        #video-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 20px; }
        .session-box { width: 140px; height: 90px; border: 1px solid #222; position: relative; overflow: hidden; border-radius: 4px; }
        iframe { width: 100%; height: 100%; border: none; transform: scale(1.1); }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
    </style>
</head>
<body>

<div class="control-panel">
    <h1>G-SHOP T1-SMART ENGINE v4.0</h1>
    <input type="text" id="vLink" placeholder="PASTE YOUTUBE VIDEO LINK HERE...">
    <br>
    <button onclick="startSmartEngine()">ACTIVATE UNIQUE SESSIONS</button>
    <div id="log-stream">ENGINE STANDBY... WAITING FOR INJECTION</div>
</div>

<div id="video-grid"></div>

<script>
    function updateLog(msg) {
        document.getElementById('log-stream').innerHTML = ">>> " + msg;
    }

    function startSmartEngine() {
        const input = document.getElementById('vLink').value;
        let vId = "";
        
        if(input.includes("v=")) vId = input.split("v=")[1].split("&")[0];
        else if(input.includes("youtu.be/")) vId = input.split("youtu.be/")[1].split("?")[0];
        else vId = input;

        if(vId.length < 5) { alert("Invalid Link!"); return; }

        const grid = document.getElementById('video-grid');
        grid.innerHTML = ""; 
        updateLog("INITIALIZING MULTI-TIMING SESSIONS...");

        // Spawning 60 Unique Sessions (Optimal for performance)
        for(let i = 0; i < 60; i++) {
            setTimeout(() => {
                const box = document.createElement('div');
                box.className = "session-box";
                
                // --- SMART TIMING LOGIC ---
                // Har video ka start point alag hoga (0 to 300 seconds)
                const randomStart = Math.floor(Math.random() * 300); 
                // Har video ka playback speed thoda alag (YouTube supports this via API, but here we use random start for pattern break)
                
                box.innerHTML = `
                    <div class="overlay"></div>
                    <iframe src="https://www.youtube.com/embed/${vId}?autoplay=1&mute=1&playlist=${vId}&loop=1&start=${randomStart}&enablejsapi=1&origin=https://google.com" 
                            allow="autoplay"></iframe>`;
                
                grid.appendChild(box);
                updateLog(`SESSION #${i+1} STARTED AT ${randomStart}s | UNIQUE_ID: ${Math.random().toString(36).substr(2, 9)}`);
            }, i * 1500); // 1.5 second gap taaki sessions ek saath na dikhein
        }
        
        updateLog("SUCCESS: ALL SESSIONS RUNNING ON UNIQUE TIMELINES.");
    }
</script>

</body>
</html>
