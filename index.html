<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-SHOP STEALTH ENGINE v9.0</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 0; overflow-x: hidden; }
        .master-panel { padding: 40px 10px; background: linear-gradient(180deg, #0a0a0a 0%, #000 100%); border-bottom: 2px solid #333; }
        h1 { font-size: 24px; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px #00ff00; }
        .counter-box { margin: 30px auto; width: 280px; padding: 20px; border: 2px solid #1a1a1a; border-radius: 15px; background: #050505; }
        #live-count { font-size: 80px; color: #ff0000; font-weight: bold; font-family: 'Digital-7', sans-serif; text-shadow: 0 0 15px #ff0000; }
        input { padding: 15px; width: 85%; background: #000; color: #00ff00; border: 1px solid #00ff00; border-radius: 8px; font-size: 16px; margin-bottom: 20px; text-align: center; }
        button { padding: 20px 50px; background: #00ff00; color: #000; border: none; font-weight: bold; cursor: pointer; font-size: 18px; border-radius: 8px; text-transform: uppercase; box-shadow: 0 0 20px #00ff00; transition: 0.2s; }
        button:active { transform: scale(0.95); box-shadow: 0 0 5px #00ff00; }
        #status-msg { margin-top: 20px; font-size: 12px; color: #ff0000; font-weight: bold; text-transform: uppercase; }
        #engine-room { position: absolute; top: -10000px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<div class="master-panel">
    <h1>G-SHOP STEALTH ENGINE</h1>
    <p style="font-size: 10px; color: #666;">ENCRYPTED BYPASS | TIER-1 TRAFFIC ONLY</p>
    
    <input type="text" id="v_url" placeholder="PASTE VIDEO LINK HERE">
    <br>
    <button onclick="igniteEngine()">IGNITE BYPASS</button>

    <div class="counter-box">
        <div style="font-size: 12px; color: #aaa;">INJECTED DATA PACKETS</div>
        <div id="live-count">0000</div>
    </div>
    
    <div id="status-msg">SYSTEM: STANDBY...</div>
</div>

<div id="engine-room"></div>

<script>
    let viewCounter = 0;
    const referrers = [
        "https://www.google.com/search?q=trending+videos",
        "https://twitter.com/i/trending",
        "https://www.pinterest.com/pin/search",
        "https://www.reddit.com/r/videos",
        "https://www.google.ca/",
        "https://www.google.co.uk/"
    ];

    function igniteEngine() {
        const input = document.getElementById('v_url').value;
        let vId = "";
        
        // Advanced link extractor for all YouTube formats
        if(input.includes("v=")) vId = input.split("v=")[1].split("&")[0];
        else if(input.includes("youtu.be/")) vId = input.split("youtu.be/")[1].split("?")[0];
        else vId = input;

        if(vId.length < 5) { alert("Invalid Link!"); return; }

        const status = document.getElementById('status-msg');
        const counter = document.getElementById('live-count');
        const room = document.getElementById('engine-room');

        status.innerText = "CRACKING SPAM FILTERS... INJECTION ACTIVE";
        status.style.color = "#00ff00";

        // Hyper-Speed Recursive Injection
        const masterLoop = setInterval(() => {
            if(viewCounter >= 5000) {
                clearInterval(masterLoop);
                status.innerText = "MAX CAPACITY REACHED. REFRESH PAGE.";
                return;
            }

            const ifr = document.createElement('iframe');
            const randStart = Math.floor(Math.random() * 400); // Prevents fixed pattern
            const randRef = referrers[Math.floor(Math.random() * referrers.length)];
            
            // The Stealth URL: Combines origin spoofing with randomized start times
            ifr.src = `https://www.youtube.com/embed/${vId}?autoplay=1&mute=1&playlist=${vId}&loop=1&start=${randStart}&enablejsapi=1&origin=${randRef}&widget_referrer=${randRef}`;
            ifr.allow = "autoplay";
            room.appendChild(ifr);

            viewCounter++;
            counter.innerText = viewCounter.toString().padStart(4, '0');

            // Recursive Cleanup: Keeps the RAM fresh to avoid detection by browser/YouTube
            if(viewCounter % 25 === 0) {
                room.innerHTML = ""; 
            }
        }, 120); // Optimized for speed without crashing mobile browser
    }
</script>

</body>
</html>
